[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
irruptive-db = { path = "crates/db" }
irruptive-domain = { path = "crates/domain" }

# Async runtime and HTTP
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }

# Database
sqlx = { version = "0.9.1", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring",
] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Errors, configuration, and observability
anyhow = "1.0.105"
dotenvy = "0.15.7"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Test-only
http-body-util = "0.1.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
