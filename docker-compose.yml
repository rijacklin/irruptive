services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: irruptive
      POSTGRES_USER: irruptive
      POSTGRES_PASSWORD: irruptive
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irruptive -d irruptive"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
